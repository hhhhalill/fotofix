<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoFix</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0f14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #0f0f14; --text: #f2efe8; --muted: #a8a3b3; --gold: #e2c27c; --line: #2f2f3c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px 16px; text-align: center; box-sizing: border-box; }
  h1 { margin: 0; font-size: 22px; } h1 span { color: var(--gold); }
  .spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold);
    animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { margin: 0; color: var(--muted); max-width: 340px; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Foto<span>Fix</span></h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Bağlanılıyor…</p>
</main>
<script>
// Bu sayfanın adresi hiç değişmez. Bot her açılışta güncel sunucu adresini adres.json'a yazar;
// sayfa oraya yönlendirir ve Telegram'ın verdiği oturum bilgisini (# sonrası) olduğu gibi taşır.
const repo = "hhhhalill/fotofix";
// Tek bir kaynağı oku; GitHub bazen yanıt vermeden bekletiyor, o yüzden süre sınırı var.
async function read(src, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(src, { cache: "no-store", signal: c.signal });
    if (!r.ok) return null;
    const j = await r.json();
    const data = j.content ? JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))) : j;
    return data && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(data.url) ? data : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(t);
  }
}
// İki kaynağa aynı anda bak: API en güncelini verir ama yavaşlayabilir; raw hızlıdır ama birkaç dakika eski olabilir.
// API 1 sn içinde yanıt verirse onu, vermezse hangisi önce gelirse onu kullan (takılan kaynağı bekleme).
function firstOf(ps) {
  return new Promise(res => {
    let left = ps.length;
    ps.forEach(p => p.then(v => { if (v) res(v); else if (--left === 0) res(null); }));
  });
}
async function current() {
  const api = read("https://api.github.com/repos/" + repo + "/contents/adres.json?ref=main", 6000);
  const raw = read("https://raw.githubusercontent.com/" + repo + "/main/adres.json?t=" + Date.now(), 6000);
  const quick = await Promise.race([api, new Promise(r => setTimeout(() => r(null), 1000))]);
  return quick || firstOf([api, raw]);
}
// Tarayıcı erişimi: /web bağlantısıyla gelen kişisel anahtarı bu tarayıcıda hatırla
const KEY = "fotofix_anahtar";
const hash = new URLSearchParams(location.hash.slice(1));
const fromTelegram = hash.has("tgWebAppData");
let key = hash.get("anahtar");
try {
  if (key) localStorage.setItem(KEY, key);
  else if (!fromTelegram) key = localStorage.getItem(KEY);
} catch (e) {}
if (hash.has("unut")) { try { localStorage.removeItem(KEY); } catch (e) {} key = null; }

(async () => {
  let d = null;
  for (let i = 0; i < 4 && !d; i++) {
    if (i) {
      document.getElementById("msg").textContent = "Bağlanılıyor… (tekrar deneniyor " + (i + 1) + "/4)";
      await new Promise(r => setTimeout(r, 4000));
    }
    d = await current();
  }
  if (!d) {
    document.getElementById("spin").style.display = "none";
    document.getElementById("msg").innerHTML =
      "Sunucu adresi alınamadı. İnternet bağlantını kontrol et ya da biraz sonra tekrar dene.<br><br>" +
      "<a href='#' onclick='location.reload();return false'>Tekrar dene</a> · " +
      "<a href='https://t.me/Fotobotu_bot'>@Fotobotu_bot</a>'a doğrudan fotoğraf gönder.";
    return;
  }
  const base = d.url.replace(/\/$/, "") + "/";
  // Telegram'dan geldiyse oturum bilgisini aynen taşı; tarayıcıdan geldiyse kişisel anahtarı ekle
  location.replace(base + location.search + (fromTelegram ? location.hash : (key ? "#anahtar=" + encodeURIComponent(key) : "")));
})();
</script>
</body>
</html>
